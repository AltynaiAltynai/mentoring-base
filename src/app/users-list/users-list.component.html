<div class="users">
    <div class="usersTitle">КОМПОНЕНТ СПИСКА ЮЗЕРОВ</div>

<div class="usersCard">
    <div class="usersCardItem " *ngFor="let item of users">
        <p>{{$any(item).name}}</p>
        <p >{{$any(item).email}}</p>
        <p>{{$any(item).website}}</p>
        <p>{{$any(item).company.name}}</p>
        
        <button (click)="deleteUser(item.id)">удалить юзера</button>
    </div>
</div>
</div>
